<style>
  .jk-lightbox { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); opacity:0; visibility:hidden; transition:opacity .2s,visibility .2s; }
  .jk-lightbox.active { opacity:1; visibility:visible; }
  .jk-lightbox__img { width:100%; height:100%; max-width:90vw; max-height:calc(100vh - 160px); object-fit:contain; border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,.4); }
  .jk-lightbox__close { position:absolute; top:1rem; right:1rem; width:2.5rem; height:2.5rem; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.15); border:none; border-radius:50%; color:#fff; font-size:1.5rem; cursor:pointer; transition:background .15s; }
  .jk-lightbox__close:hover { background:rgba(255,255,255,.3); }
  .jk-lightbox__nav { position:absolute; top:50%; transform:translateY(-50%); width:2.75rem; height:2.75rem; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.15); border:none; border-radius:50%; color:#fff; cursor:pointer; transition:background .15s; }
  .jk-lightbox__nav:hover { background:rgba(255,255,255,.3); }
  .jk-lightbox__nav--prev { left:1rem; } .jk-lightbox__nav--next { right:1rem; }
  .jk-lightbox__main { display:flex; align-items:center; justify-content:center; width:100%; height:calc(100% - 100px); padding:3rem 4rem; }
  .jk-lightbox__zoom-controls { position:absolute; bottom:5rem; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:0.5rem; background:rgba(0,0,0,.5); border-radius:2rem; padding:0.4rem 0.9rem; }
  .jk-lightbox__zoom-controls button { background:none; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; opacity:.8; transition:opacity .15s; padding:0.2rem; }
  .jk-lightbox__zoom-controls button:hover { opacity:1; }
  #jk-lightbox-zoom-level { color:rgba(255,255,255,.85); font-size:0.8rem; min-width:2.5rem; text-align:center; }
  .jk-lightbox__filename { position:absolute; top:1rem; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.8); font-size:0.8rem; max-width:60vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jk-lightbox__counter { position:absolute; bottom:5.5rem; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.7); font-size:0.875rem; }
  .jk-lightbox__strip { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.75rem 1rem; background:rgba(0,0,0,.6); backdrop-filter:blur(8px); overflow-x:auto; }
  .jk-lightbox__strip-thumb { width:52px; height:52px; object-fit:cover; border-radius:5px; cursor:pointer; border:2px solid transparent; opacity:.5; transition:opacity .15s,border-color .15s; flex-shrink:0; }
  .jk-lightbox__strip-thumb:hover { opacity:.8; }
  .jk-lightbox__strip-thumb.active { opacity:1; border-color:#6366f1; }
</style>

<div class="jk-lightbox" id="jk-lightbox" onclick="closeLightboxOutside(event)">
  <button class="jk-lightbox__close" onclick="closeLightbox()" title="Close (Esc)">&times;</button>
  <button class="jk-lightbox__nav jk-lightbox__nav--prev" onclick="navigateLightbox(-1)" title="Prev">
    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="jk-lightbox__main" id="jk-lightbox-main">
    <img class="jk-lightbox__img" id="jk-lightbox-img" src="" alt="">
  </div>
  <button class="jk-lightbox__nav jk-lightbox__nav--next" onclick="navigateLightbox(1)" title="Next">
    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="jk-lightbox__zoom-controls">
    <button onclick="zoomLightbox(-1)" title="Zoom Out"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg></button>
    <span id="jk-lightbox-zoom-level">100%</span>
    <button onclick="zoomLightbox(1)" title="Zoom In"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg></button>
  </div>
  <span class="jk-lightbox__filename" id="jk-lightbox-name"></span>
  <span class="jk-lightbox__counter" id="jk-lightbox-counter"></span>
  <div class="jk-lightbox__strip" id="jk-lightbox-strip"></div>
</div>

<script>
(function () {
  var gallery = [], currentIdx = 0, zoomLevel = 1;
  var panX = 0, panY = 0, isPanning = false, panStartX = 0, panStartY = 0;
  
  // Expose these for external access if needed, but standard logic relies on DOM load
  var box     = document.getElementById('jk-lightbox');
      if (!box) return;
      var mainEl  = document.getElementById('jk-lightbox-main');
      var img     = document.getElementById('jk-lightbox-img');
      var nameEl  = document.getElementById('jk-lightbox-name');
      var counterEl = document.getElementById('jk-lightbox-counter');
      var stripEl = document.getElementById('jk-lightbox-strip');
      var zoomEl  = document.getElementById('jk-lightbox-zoom-level');
      var prevBtn = box.querySelector('.jk-lightbox__nav--prev');
      var nextBtn = box.querySelector('.jk-lightbox__nav--next');

      function applyTransform() {
        img.style.transform = 'scale('+zoomLevel+') translate('+(panX/zoomLevel)+'px,'+(panY/zoomLevel)+'px)';
        zoomEl.textContent = Math.round(zoomLevel * 100) + '%';
      }
      function resetTransform() { zoomLevel = 1; panX = 0; panY = 0; applyTransform(); }

      window.zoomLightbox = function(dir) {
        zoomLevel = Math.max(0.25, Math.min(5, zoomLevel + dir * 0.25));
        if (zoomLevel <= 1) { panX = 0; panY = 0; }
        applyTransform();
      };
      window.resetZoom = function() { resetTransform(); };

      var IMAGE_EXTS = ['jpg','jpeg','png','gif','webp','bmp','svg','avif','ico'];
      function isImageUrl(url) {
        var ext = (url || '').split('?')[0].split('#')[0].split('.').pop().toLowerCase();
        return IMAGE_EXTS.indexOf(ext) !== -1;
      }

      window.openLightbox = function(el) {
        // Find src from dataset or direct property. Works for both raw strings and DOM elements.
        var src = (typeof el === 'string') ? el : (el.dataset.lightboxSrc || el.src || '');
        if (!isImageUrl(src)) {
          window.open(src, '_blank', 'noopener,noreferrer');
          return;
        }
        var group = (typeof el !== 'string' && el.dataset.lightboxGroup) ? el.dataset.lightboxGroup : 'default';
        var thumbs = Array.from(document.querySelectorAll('[data-lightbox-group="' + group + '"]'))
                          .filter(function(t) { return isImageUrl(t.dataset.lightboxSrc || ''); });
        
        // If el is not in DOM with data-lightbox-group, just display it alone.
        if (thumbs.length === 0 && typeof el !== 'string') {
            gallery = [{ src: src, name: el.dataset.lightboxName || el.alt || '' }];
            currentIdx = 0;
        } else if (thumbs.length === 0 && typeof el === 'string') {
            gallery = [{ src: src, name: '' }];
            currentIdx = 0;
        } else {
            gallery = thumbs.map(function(t) {
              return { src: t.dataset.lightboxSrc, name: t.dataset.lightboxName || '' };
            });
            currentIdx = thumbs.indexOf(el);
            if (currentIdx < 0) currentIdx = 0;
        }
        
        resetTransform();
        buildStrip();
        showImage();
        box.classList.add('active');
        document.body.style.overflow = 'hidden';
      };
      
      window.closeLightbox = function() {
        box.classList.remove('active');
        document.body.style.overflow = '';
        resetTransform();
      };
      window.closeLightboxOutside = function(e) {
        if (e.target === box || (e.target === mainEl && zoomLevel <= 1)) closeLightbox();
      };
      window.navigateLightbox = function(dir) {
        currentIdx = (currentIdx + dir + gallery.length) % gallery.length;
        resetTransform(); showImage();
      };

      mainEl.addEventListener('wheel', function(e) {
        if (!box.classList.contains('active')) return;
        e.preventDefault();
        zoomLightbox(e.deltaY < 0 ? 1 : -1);
      }, { passive: false });

      img.addEventListener('mousedown', function(e) {
        if (zoomLevel <= 1) return;
        e.preventDefault(); isPanning = true;
        panStartX = e.clientX - panX; panStartY = e.clientY - panY;
        img.style.cursor = 'grabbing';
      });
      document.addEventListener('mousemove', function(e) {
        if (!isPanning) return;
        panX = e.clientX - panStartX; panY = e.clientY - panStartY; applyTransform();
      });
      document.addEventListener('mouseup', function() {
        if (isPanning) { isPanning = false; img.style.cursor = zoomLevel > 1 ? 'grab' : ''; }
      });

      var lastTouchDist = 0;
      mainEl.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        } else if (e.touches.length === 1 && zoomLevel > 1) {
          isPanning = true; panStartX = e.touches[0].clientX - panX; panStartY = e.touches[0].clientY - panY;
        }
      }, { passive: true });
      mainEl.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          var dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          zoomLevel = Math.max(0.25, Math.min(5, zoomLevel + (dist - lastTouchDist) * 0.01));
          lastTouchDist = dist; applyTransform();
        } else if (e.touches.length === 1 && isPanning) {
          panX = e.touches[0].clientX - panStartX; panY = e.touches[0].clientY - panStartY; applyTransform();
        }
      }, { passive: false });
      mainEl.addEventListener('touchend', function() { isPanning = false; lastTouchDist = 0; });

      img.addEventListener('dblclick', function() {
        if (zoomLevel > 1) { resetTransform(); } else { zoomLevel = 2.5; applyTransform(); }
      });

      function buildStrip() {
        stripEl.innerHTML = '';
        if (gallery.length <= 1) { stripEl.style.display = 'none'; return; }
        stripEl.style.display = '';
        gallery.forEach(function(item, i) {
          var thumb = document.createElement('img');
          thumb.src = item.src; thumb.alt = item.name;
          thumb.className = 'jk-lightbox__strip-thumb' + (i === currentIdx ? ' active' : '');
          thumb.onclick = function(e) { e.stopPropagation(); currentIdx = i; resetTransform(); showImage(); };
          stripEl.appendChild(thumb);
        });
      }
      function showImage() {
        var item = gallery[currentIdx];
        img.src = item.src; img.alt = item.name; nameEl.textContent = item.name;
        var multi = gallery.length > 1;
        prevBtn.style.display = multi ? '' : 'none'; nextBtn.style.display = multi ? '' : 'none';
        counterEl.textContent = multi ? (currentIdx + 1) + ' / ' + gallery.length : '';
        img.style.cursor = '';
        var thumbs = stripEl.querySelectorAll('.jk-lightbox__strip-thumb');
        thumbs.forEach(function(t, i) { t.classList.toggle('active', i === currentIdx); });
        if (thumbs[currentIdx]) thumbs[currentIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      document.addEventListener('keydown', function(e) {
        if (!box.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigateLightbox(-1);
        if (e.key === 'ArrowRight') navigateLightbox(1);
        if (e.key === '+' || e.key === '=') zoomLightbox(1);
        if (e.key === '-') zoomLightbox(-1);
        if (e.key === '0') resetZoom();
      });
})();
</script>
