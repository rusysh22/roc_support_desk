{% with t=case_type %}
<span class="jk-badge" style="{% if t == 'Incident' %}background:#ffe4e6;color:#be123c;{% elif t == 'Request' %}background:#e0e7ff;color:#4338ca;{% elif t == 'Question' %}background:#ede9fe;color:#6d28d9;{% else %}background:#f1f5f9;color:#475569;{% endif %}">{{ t|default:"—" }}</span>
{% endwith %}
