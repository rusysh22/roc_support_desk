<!-- Docs search modal (Ctrl+K). Indexes all .docs-toc-link entries + their target section text at open-time.
     Include once per page, at the end of the content block. Pairs with docs/_docs_search_trigger.html. -->
<style>
    .docs-search-trigger {
        display: flex; align-items: center; gap: 8px; width: 100%;
        background: #fff; border: 1px solid var(--jk-border); border-radius: var(--jk-radius-sm);
        padding: 8px 10px; font-size: 12.5px; color: var(--jk-text-muted); cursor: pointer;
        margin-bottom: 8px; text-align: left; transition: all .15s;
    }
    .docs-search-trigger:hover { border-color: var(--jk-primary); color: var(--jk-text); }
    .docs-search-trigger kbd {
        margin-left: auto; display: inline-flex; align-items: center; gap: 2px;
        background: var(--jk-surface-alt); border: 1px solid var(--jk-border); border-radius: 4px;
        padding: 1px 5px; font-size: 10.5px; font-family: inherit; color: var(--jk-text-muted);
    }
    .docs-search-overlay {
        position: fixed; inset: 0; background: rgba(15,15,15,0.5); backdrop-filter: blur(2px);
        z-index: 9999; display: none; align-items: flex-start; justify-content: center;
        padding: 12vh 16px 16px;
    }
    .docs-search-overlay:not([hidden]) { display: flex; }
    .docs-search-box {
        width: 100%; max-width: 560px; background: #fff; border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35); overflow: hidden;
        display: flex; flex-direction: column; max-height: 70vh;
    }
    .docs-search-input-wrap { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--jk-border); flex-shrink: 0; }
    .docs-search-input-wrap svg { flex-shrink: 0; color: var(--jk-text-muted); width: 18px; height: 18px; }
    #docs-search-input { flex: 1; border: none; outline: none; font-size: 15px; color: var(--jk-text); background: transparent; }
    #docs-search-close { flex-shrink: 0; border: 1px solid var(--jk-border); border-radius: 6px; background: var(--jk-surface-alt); color: var(--jk-text-muted); font-size: 11px; padding: 3px 7px; cursor: pointer; }
    .docs-search-results { overflow-y: auto; padding: 8px; }
    .docs-search-item { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 8px; padding: 9px 12px; cursor: pointer; }
    .docs-search-item.active, .docs-search-item:hover { background: var(--jk-surface-alt); }
    .docs-search-item-title { font-size: 13.5px; font-weight: 700; color: var(--jk-text); margin-bottom: 2px; }
    .docs-search-item-snippet { font-size: 12px; color: var(--jk-text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .docs-search-empty { padding: 24px 16px; text-align: center; font-size: 13px; color: var(--jk-text-muted); }
    @keyframes docsSearchFlash { 0%, 100% { box-shadow: none; } 25%, 75% { box-shadow: 0 0 0 3px var(--jk-primary); } }
    .docs-search-highlight { animation: docsSearchFlash 1.6s ease; border-radius: var(--jk-radius, 10px); }
    @media (max-width: 640px) {
        .docs-search-overlay { padding-top: 8vh; }
        .docs-search-box { max-height: 78vh; }
    }
</style>

<div id="docs-search-modal" class="docs-search-overlay" hidden>
    <div class="docs-search-box" role="dialog" aria-modal="true" aria-label="Search documentation">
        <div class="docs-search-input-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
            <input type="text" id="docs-search-input" autocomplete="off" spellcheck="false"
                   data-ph-id="Cari bagian, misalnya: SSO, Email, Knowledge Base..."
                   data-ph-en="Search a section, e.g. SSO, Email, Knowledge Base...">
            <button type="button" id="docs-search-close">Esc</button>
        </div>
        <div id="docs-search-results" class="docs-search-results"></div>
        <div id="docs-search-empty" class="docs-search-empty" hidden>
            <span class="lang-id">Tidak ada hasil ditemukan.</span><span class="lang-en">No results found.</span>
        </div>
    </div>
</div>

<script>
(function() {
    const trigger = document.getElementById('docs-search-trigger');
    const overlay = document.getElementById('docs-search-modal');
    const input = document.getElementById('docs-search-input');
    const resultsEl = document.getElementById('docs-search-results');
    const emptyEl = document.getElementById('docs-search-empty');
    const closeBtn = document.getElementById('docs-search-close');
    if (!overlay || !input) return;

    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
    const kbdMod = document.getElementById('docs-search-kbd-mod');
    if (kbdMod && isMac) kbdMod.textContent = '⌘';

    let index = [];
    let activeIndex = -1;

    function currentLang() {
        return document.body.classList.contains('lang-en') ? 'en' : 'id';
    }

    function textFor(el) {
        const clone = el.cloneNode(true);
        const hideClass = currentLang() === 'en' ? 'lang-id' : 'lang-en';
        clone.querySelectorAll('.' + hideClass).forEach(n => n.remove());
        return clone.textContent.replace(/\s+/g, ' ').trim();
    }

    function buildIndex() {
        index = [];
        document.querySelectorAll('.docs-toc-link[href^="#"]').forEach(link => {
            const id = link.getAttribute('href').slice(1);
            const target = document.getElementById(id);
            if (!target) return;
            const title = textFor(link).replace(/^↳\s*/, '');
            const snippet = textFor(target).slice(0, 220);
            index.push({ id, title, snippet, el: target });
        });
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function render(query) {
        const q = query.trim().toLowerCase();
        let matches;
        if (!q) {
            matches = index.slice(0, 8);
        } else {
            matches = index.filter(item =>
                item.title.toLowerCase().includes(q) || item.snippet.toLowerCase().includes(q)
            );
            matches.sort((a, b) => {
                const at = a.title.toLowerCase().includes(q) ? 0 : 1;
                const bt = b.title.toLowerCase().includes(q) ? 0 : 1;
                return at - bt;
            });
            matches = matches.slice(0, 12);
        }
        activeIndex = matches.length ? 0 : -1;
        resultsEl.innerHTML = '';
        emptyEl.hidden = matches.length !== 0;
        matches.forEach((item, i) => {
            const row = document.createElement('button');
            row.type = 'button';
            row.className = 'docs-search-item' + (i === 0 ? ' active' : '');
            row.innerHTML = '<div class="docs-search-item-title">' + escapeHtml(item.title) + '</div>' +
                             (item.snippet ? '<div class="docs-search-item-snippet">' + escapeHtml(item.snippet) + '</div>' : '');
            row.addEventListener('click', () => jump(item));
            row.addEventListener('mouseenter', () => setActive(i));
            resultsEl.appendChild(row);
        });
        resultsEl.__matches = matches;
    }

    function setActive(i) {
        const items = Array.from(resultsEl.children);
        if (!items.length) return;
        if (items[activeIndex]) items[activeIndex].classList.remove('active');
        activeIndex = i;
        items[activeIndex].classList.add('active');
    }

    function moveActive(delta) {
        const items = Array.from(resultsEl.children);
        if (!items.length) return;
        setActive((activeIndex + delta + items.length) % items.length);
        items[activeIndex].scrollIntoView({ block: 'nearest' });
    }

    function openModal() {
        buildIndex();
        overlay.hidden = false;
        document.body.style.overflow = 'hidden';
        input.placeholder = input.dataset['ph' + (currentLang() === 'en' ? 'En' : 'Id')];
        input.value = '';
        render('');
        setTimeout(() => input.focus(), 10);
    }

    function closeModal() {
        overlay.hidden = true;
        document.body.style.overflow = '';
    }

    function jump(item) {
        closeModal();
        item.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        item.el.classList.add('docs-search-highlight');
        setTimeout(() => item.el.classList.remove('docs-search-highlight'), 1600);
        history.replaceState(null, '', '#' + item.id);
    }

    document.addEventListener('keydown', function(e) {
        const isK = e.key === 'k' || e.key === 'K';
        if ((e.ctrlKey || e.metaKey) && isK) {
            e.preventDefault();
            if (overlay.hidden) openModal(); else closeModal();
        } else if (e.key === 'Escape' && !overlay.hidden) {
            closeModal();
        } else if (!overlay.hidden && e.key === 'ArrowDown') {
            e.preventDefault(); moveActive(1);
        } else if (!overlay.hidden && e.key === 'ArrowUp') {
            e.preventDefault(); moveActive(-1);
        } else if (!overlay.hidden && e.key === 'Enter') {
            const matches = resultsEl.__matches || [];
            if (activeIndex >= 0 && matches[activeIndex]) { e.preventDefault(); jump(matches[activeIndex]); }
        }
    });

    if (trigger) trigger.addEventListener('click', openModal);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
    closeBtn.addEventListener('click', closeModal);
    input.addEventListener('input', function() { render(input.value); });
})();
</script>
