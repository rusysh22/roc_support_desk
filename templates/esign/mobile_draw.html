<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw Signature</title>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
.header { background: #1e3a5f; color: white; padding: 16px 20px; text-align: center; }
.header h1 { font-size: 18px; font-weight: 700; }
.header p { font-size: 12px; opacity: 0.75; margin-top: 4px; }
.content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.instructions { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #1e40af; }
.canvas-wrap { border: 2px dashed #6366f1; border-radius: 12px; background: white; overflow: hidden; touch-action: none; }
#sig-canvas { display: block; width: 100%; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; border: none; cursor: pointer; transition: opacity 0.15s; }
.btn-primary { background: #4f46e5; color: white; }
.btn-outline { background: white; color: #64748b; border: 1px solid #e2e8f0; font-size: 14px; }
.btn:active { opacity: 0.8; }
.footer { padding: 12px 20px; text-align: center; font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>
<div class="header">
    <h1>Draw Your Signature</h1>
    <p>Sign in the box below using your finger</p>
</div>

<div class="content">
    <div class="instructions">
        Use your finger to draw your signature in the box below, then tap <strong>Confirm</strong>.
    </div>

    <div class="canvas-wrap">
        <canvas id="sig-canvas" height="220"></canvas>
    </div>

    <button class="btn btn-outline" id="clear-btn">Clear</button>

    <form method="post" id="sig-form">
        {% csrf_token %}
        <input type="hidden" name="signature_data" id="sig-data-input">
        <button type="button" class="btn btn-primary" id="confirm-btn">✅ Confirm Signature</button>
    </form>

    <p id="error-msg" style="display:none;color:#dc2626;text-align:center;font-size:13px;">
        Please draw your signature first.
    </p>
</div>

<div class="footer">Your signature is end-to-end encrypted and only used for this document.</div>

<script>
const canvas = document.getElementById('sig-canvas');
canvas.width  = canvas.offsetWidth || window.innerWidth - 44;
canvas.height = 220;

const sigPad = new SignaturePad(canvas, {
    backgroundColor: 'rgba(255,255,255,0)',
    minWidth: 1.5,
    maxWidth: 3,
    penColor: '#1e293b',
});

document.getElementById('clear-btn').addEventListener('click', () => {
    sigPad.clear();
    document.getElementById('error-msg').style.display = 'none';
});

document.getElementById('confirm-btn').addEventListener('click', () => {
    if (sigPad.isEmpty()) {
        document.getElementById('error-msg').style.display = 'block';
        return;
    }
    document.getElementById('sig-data-input').value = sigPad.toDataURL('image/png');
    document.getElementById('sig-form').submit();
});

window.addEventListener('resize', () => {
    const data = sigPad.toDataURL();
    canvas.width = canvas.offsetWidth;
    if (!sigPad.isEmpty()) sigPad.fromDataURL(data);
});
</script>
</body>
</html>
