<div class="flex flex-col gap-1">
    <label class="text-xs font-semibold text-slate-500">Status</label>
    <select name="status" class="jk-select jk-input w-full">
        <option value="">All statuses</option>
        {% for value, label in status_choices %}
        <option value="{{ value }}" {% if status_filter == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
<label class="flex items-center gap-2 text-xs font-semibold text-slate-500 whitespace-nowrap cursor-pointer pb-2.5">
    <input type="checkbox" name="show_archived" value="1" {% if show_archived %}checked{% endif %}
           class="rounded border-slate-300 text-indigo-600 shadow-sm focus:ring-indigo-500">
    Show archived
</label>
