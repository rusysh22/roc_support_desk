{% extends "base.html" %}
{% block title %}Link Expired — E-Sign{% endblock %}

{% block layout %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 max-w-md w-full p-8 text-center">
        <div class="text-5xl mb-4">⏰</div>
        <h1 class="text-xl font-bold text-slate-700 mb-2">Signing Link Expired</h1>
        <p class="text-slate-600 text-sm">
            The signing link for <strong>{{ document.title }}</strong> is no longer valid.
            Please contact the document owner to request a new link.
        </p>
        <p class="text-xs text-slate-400 mt-6">You may close this page.</p>
    </div>
</div>
{% endblock %}
