<p style="margin:0 0 16px;font-size:15px;color:#475569;line-height:1.6;">{{ description|safe }}</p>
{% if message_preview %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f8fa;border:1px solid #dbe7ec;margin:0 0 8px;">
  <tr>
    <td style="padding:14px 16px;border-left:3px solid #6366f1;">
      <p style="margin:0;font-size:14px;color:#334155;line-height:1.55;">{{ message_preview|linebreaksbr }}</p>
    </td>
  </tr>
</table>
{% endif %}
