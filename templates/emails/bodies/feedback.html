<p style="margin:0 0 14px;font-size:15px;color:#475569;line-height:1.6;">
  New feedback from <span style="color:#0f172a;font-weight:500;">{{ sender_name }}</span>
  (<span style="color:#312e81;">{{ sender_email }}</span>).
</p>
<p style="margin:0 0 8px;font-size:13px;color:#64748b;line-height:1.5;">
  <strong style="color:#334155;">Type:</strong> {{ feedback_type }}<br>
  <strong style="color:#334155;">Subject:</strong> {{ subject }}
</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f8fa;border:1px solid #dbe7ec;margin:8px 0 0;">
  <tr>
    <td style="padding:14px 16px;border-left:3px solid #4f46e5;">
      <p style="margin:0;font-size:14px;color:#334155;line-height:1.55;white-space:pre-wrap;">{{ message_text }}</p>
    </td>
  </tr>
</table>
