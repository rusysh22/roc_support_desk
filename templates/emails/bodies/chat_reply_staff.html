<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f8fa;border:1px solid #dbe7ec;margin:0 0 16px;">
  <tr>
    <td style="padding:16px 18px;">
      <p style="margin:0 0 3px;font-size:12px;color:#64748b;font-weight:500;">Ticket</p>
      <p style="margin:0 0 14px;font-size:17px;font-weight:600;color:#312e81;letter-spacing:-0.01em;">{{ case_number }}</p>
      <p style="margin:0 0 3px;font-size:12px;color:#64748b;font-weight:500;">From</p>
      <p style="margin:0 0 14px;font-size:15px;color:#0f172a;font-weight:500;">{{ from_name }}</p>
      <p style="margin:0 0 3px;font-size:12px;color:#64748b;font-weight:500;">Subject</p>
      <p style="margin:0;font-size:15px;color:#0f172a;font-weight:500;">{{ case_subject }}</p>
    </td>
  </tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f8fa;border:1px solid #dbe7ec;">
  <tr>
    <td style="padding:14px 16px;border-left:3px solid #6366f1;">
      <p style="margin:0;font-size:14px;color:#334155;line-height:1.55;">{{ message_preview }}</p>
    </td>
  </tr>
</table>
