<p style="margin:0 0 6px;font-size:15px;color:#475569;line-height:1.6;">Hello <span style="color:#0f172a;font-weight:600;">{{ requester_name }}</span>,</p>
<p style="margin:0;font-size:15px;color:#475569;line-height:1.6;">{{ detail }}</p>

{% if solution %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:18px 0 0;border:1px solid #e0e7ff;border-left:4px solid #10b981;border-radius:10px;background:#ffffff;">
  <tr>
    <td style="padding:12px 16px;">
      <p style="margin:0 0 6px;font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">✅ Solution</p>
      <p style="margin:0;font-size:14px;color:#334155;line-height:1.55;white-space:pre-line;">{{ solution|striptags|truncatechars:800 }}</p>
    </td>
  </tr>
</table>
{% endif %}
