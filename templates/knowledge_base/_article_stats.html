{% comment %}
How many user accounts viewed and liked an article (each account counts once).
Usage: {% include "knowledge_base/_article_stats.html" with views=article.views_total likes=article.likes_total %}
{% endcomment %}
<span class="inline-flex items-center gap-2.5 text-xs text-slate-500" data-kb-stats data-views="{{ views }}" aria-label="{{ views }} views, {{ likes }} likes">
    <span class="inline-flex items-center gap-1" title="{{ views }} user{{ views|pluralize }} viewed this article">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        {{ views }}
    </span>
    <span class="inline-flex items-center gap-1" title="{{ likes }} user{{ likes|pluralize }} liked this article">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/></svg>
        <span data-kb-likes>{{ likes }}</span>
    </span>
</span>
