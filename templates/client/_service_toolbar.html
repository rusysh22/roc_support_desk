{% comment %}★ favorites-only + sort pill beside the grid/list switch. Behaviour: createServiceFilters() in client/_service_favorites.html.{% endcomment %}
{% if user.is_authenticated %}
<div class="inline-flex items-center rounded-lg border border-slate-200 bg-white p-0.5" role="group" aria-label="Filter services">
    <button type="button" id="services-fav-only" class="svc-tool" title="Show favorites only" aria-pressed="false">
        <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
    </button>
    <div class="relative">
        <button type="button" id="services-sort-btn" class="svc-tool" title="Sort services" aria-haspopup="menu" aria-expanded="false">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/></svg>
            <span id="services-sort-label" class="hidden sm:inline text-xs font-semibold"></span>
        </button>
        <div id="services-sort-menu" class="svc-sort-menu hidden" role="menu" aria-label="Sort services">
            <button type="button" role="menuitemradio" data-sort="default">Default order</button>
            <button type="button" role="menuitemradio" data-sort="recent">Recently used</button>
            <button type="button" role="menuitemradio" data-sort="most">Most used</button>
        </div>
    </div>
</div>
{% endif %}
